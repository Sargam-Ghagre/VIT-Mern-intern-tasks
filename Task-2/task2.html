<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>

    <style>
        body{
            background-color: #f2f2f2;
            font-family: serif;
        }

        fieldset{
            width: 850px;
            margin: 20px auto;
            padding: 20px;
            background: white;
            border: 2px solid black;
        }

        legend{
            font-size: 28px;
            font-weight: bold;
        }

        label{
            font-size: 20px;
        }

        input, textarea{
            width: 90%;
            padding: 15px;
            margin-top: 10px;
            margin-bottom: 20px;
            border-radius: 8px;
            border: 1px solid #ccc;
            font-size: 18px;
        }

        .gender input{
            width: auto;
            margin-right: 10px;
        }

        .gender label{
            margin-right: 30px;
        }

        button{
            padding: 15px 35px;
            font-size: 22px;
            border: 3px solid black;
            border-radius: 10px;
            background: white;
            cursor: pointer;
        }

        button:hover{
            background-color: lightgray;
        }
    </style>
</head>

<body>

    <form>
        <fieldset>
            <legend>User personal information</legend>

            <label>Enter your full name</label><br>
            <input type="text" placeholder="Rahul Kumar">

            <label>Enter your email</label><br>
            <input type="email" placeholder="geeks@12345gmail.com">

            <label>Enter your password</label><br>
            <input type="password">

            <label>Confirm your password</label><br>
            <input type="password">

            <label>Enter your gender</label><br><br>

            <div class="gender">
                <input type="radio" name="gender">Male

                <input type="radio" name="gender">Female

                <input type="radio" name="gender">Others
            </div>

            <br>

            <label>Enter your Date of Birth</label><br>
            <input type="date">

            <label>Enter your Address:</label><br>
            <textarea rows="4" placeholder="Noida Sector 137"></textarea>

            <br><br>

            <button type="submit">submit</button>

        </fieldset>
    </form>

</body>
</html>
